services:
  postgres:
    image: postgres:17-alpine
    container_name: leave-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leave_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - leave_management_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leave_management_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  leave_management_postgres_data: