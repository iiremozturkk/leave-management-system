services:
  postgres:
    image: postgres:17-alpine
    container_name: leave-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - leave_management_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leave-management-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: LeaveManagementSystem
      Jwt__Audience: LeaveManagementSystem.Client
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenExpirationMinutes: 60
      DatabaseInitialization__ApplyMigrationsOnStartup: "true"
      DemoData__SeedOnStartup: "${DEMO_DATA_SEED_ON_STARTUP:-false}"
      DemoData__Password: "${DEMO_DATA_PASSWORD:-}"
    ports:
      - "5252:8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://localhost:8080/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  leave_management_postgres_data: